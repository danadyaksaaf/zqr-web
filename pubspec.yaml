name: zqr
description: "zQR - QR Code Generator by Zdyaksa Labs."
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  qr_flutter: ^4.1.0
  uuid: ^4.5.1
  shared_preferences: ^2.3.5
  flutter_colorpicker: ^1.1.0
  google_fonts: ^8.2.0
  file_picker: ^11.0.2
  flutter_svg: ^2.3.0
  connectivity_plus: ^6.1.0
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logos/
